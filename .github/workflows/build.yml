name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build portable exe
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Builds are published as a GitHub Release (releases don't use the Actions storage quota).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Image Seek ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: dist/ImageSeek.exe
          fail_on_unmatched_files: true

      - name: Upload artifact (kept 1 day)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ImageSeek
          path: dist/ImageSeek.exe
          retention-days: 1
